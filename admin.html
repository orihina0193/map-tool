<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>マップツール - 管理者コントロールパネル</title>
    <!-- Google Fonts: Inter & Space Grotesk -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'],
                        display: ['Space Grotesk', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace']
                    }
                }
            }
        }
    </script>
    
    <!-- React & Babel CDN -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <style>
        body {
            background-color: #0b0f19;
            background-image: radial-gradient(circle at 50% 0%, #151f32 0%, #0b0f19 70%);
            color: #f3f4f6;
            min-height: 100vh;
        }
        .glass-card {
            background: rgba(22, 30, 49, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.06);
        }
    </style>
</head>
<body class="font-sans antialiased">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // API Endpoint from App.tsx (can also be entered dynamically if needed)
        const DEFAULT_API_ENDPOINT = "https://script.google.com/macros/s/AKfycbzOlelOcP6d8bILIhHNz4bUsnCv34o2b3RcwZSQLi2bBb1P3aKaxGVXqxFzqTMSpL0r/exec";

        function AdminApp() {
            const [apiEndpoint, setApiEndpoint] = useState(() => {
                return localStorage.getItem("gas_admin_endpoint") || DEFAULT_API_ENDPOINT;
            });
            const [token, setToken] = useState(() => {
                return localStorage.getItem("gas_admin_token") || "";
            });
            const [isLoggedIn, setIsLoggedIn] = useState(false);
            const [loading, setLoading] = useState(false);
            const [error, setError] = useState(null);
            const [toast, setToast] = useState(null);

            // Cloud Data lists
            const [pendingList, setPendingList] = useState([]);
            const [approvedList, setApprovedList] = useState([]);
            const [savedRooms, setSavedRooms] = useState([]);

            // Search query & Active tab
            const [searchQuery, setSearchQuery] = useState("");
            const [activeTab, setActiveTab] = useState("pending"); // pending, approved, active

            // Toast helper
            const showToast = (message, type = "info") => {
                setToast({ message, type });
                setTimeout(() => setToast(null), 3500);
            };

            // Login attempt (load list from GAS)
            const handleLogin = (e) => {
                if (e) e.preventDefault();
                if (!token) {
                    setError("管理用パスコード（TOKEN）を入力してください。");
                    return;
                }
                setLoading(true);
                setError(null);

                fetch(apiEndpoint, {
                    method: "POST",
                    headers: { "Content-Type": "text/plain" },
                    body: JSON.stringify({ action: "admin_list", token: token })
                })
                    .then(res => {
                        if (!res.ok) throw new Error("サーバー通信エラーが発生しました。");
                        return res.text();
                    })
                    .then(text => {
                        if (text.startsWith("ERROR:")) {
                            throw new Error(text.replace("ERROR:", "").trim());
                        }
                        try {
                            const data = JSON.parse(text);
                            setPendingList(data.pending || []);
                            setApprovedList(data.approved || []);
                            setSavedRooms((data.approved || []).map(name => ({ name, size: 0 })));
                            setIsLoggedIn(true);
                            localStorage.setItem("gas_admin_token", token);
                            localStorage.setItem("gas_admin_endpoint", apiEndpoint);
                            showToast("ログイン成功、データを取得しました", "success");
                        } catch (e) {
                            throw new Error("レスポンスの解析に失敗しました。認証情報が間違っている可能性があります。");
                        }
                    })
                    .catch(err => {
                        console.error(err);
                        setError(err.message || "接続に失敗しました。");
                    })
                    .finally(() => {
                        setLoading(false);
                    });
            };

            // Fetch latest data from cloud
            const refreshData = () => {
                if (!isLoggedIn) return;
                setLoading(true);
                fetch(apiEndpoint, {
                    method: "POST",
                    headers: { "Content-Type": "text/plain" },
                    body: JSON.stringify({ action: "admin_list", token: token })
                })
                    .then(res => {
                        if (!res.ok) throw new Error("サーバー通信エラーが発生しました。");
                        return res.text();
                    })
                    .then(text => {
                        if (text.startsWith("ERROR:")) throw new Error(text.replace("ERROR:", "").trim());
                        try {
                            const data = JSON.parse(text);
                            setPendingList(data.pending || []);
                            setApprovedList(data.approved || []);
                            setSavedRooms((data.approved || []).map(name => ({ name, size: 0 })));
                            showToast("データを更新しました！", "success");
                        } catch (e) {
                            throw new Error("データの解析に失敗しました。");
                        }
                    })
                    .catch(err => {
                        showToast("データの更新に失敗しました: " + err.message, "error");
                    })
                    .finally(() => {
                        setLoading(false);
                    });
            };

            // Action: Approve room
            const handleApprove = (roomName) => {
                if (!confirm(`「${roomName}」の作成を承認しますか？`)) return;
                setLoading(true);
                
                fetch(apiEndpoint, {
                    method: "POST",
                    headers: { "Content-Type": "text/plain" },
                    body: JSON.stringify({ action: "admin_approve", room: roomName, token: token })
                })
                .then(res => {
                    if (!res.ok) throw new Error("サーバー通信エラーが発生しました。");
                    return res.text();
                })
                .then(text => {
                    if (text.startsWith("ERROR:")) throw new Error(text.replace("ERROR:", "").trim());
                    showToast(`「${roomName}」を承認しました`, "success");
                    // Optimistic update
                    setPendingList(prev => prev.filter(r => r !== roomName));
                    if (!approvedList.includes(roomName)) {
                        setApprovedList(prev => [...prev, roomName]);
                    }
                    setTimeout(refreshData, 1000); // sync complete data
                })
                .catch(err => {
                    showToast("エラーが発生しました: " + err.message, "error");
                    setLoading(false);
                });
            };

            // Action: Reject room request
            const handleReject = (roomName) => {
                if (!confirm(`「${roomName}」の申請を却下（削除）しますか？`)) return;
                setLoading(true);

                fetch(apiEndpoint, {
                    method: "POST",
                    headers: { "Content-Type": "text/plain" },
                    body: JSON.stringify({ action: "admin_reject", room: roomName, token: token })
                })
                .then(res => {
                    if (!res.ok) throw new Error("サーバー通信エラーが発生しました。");
                    return res.text();
                })
                .then(text => {
                    if (text.startsWith("ERROR:")) throw new Error(text.replace("ERROR:", "").trim());
                    showToast(`「${roomName}」の申請を却下しました`, "warning");
                    setPendingList(prev => prev.filter(r => r !== roomName));
                    setTimeout(refreshData, 1000);
                })
                .catch(err => {
                    showToast("エラーが発生しました: " + err.message, "error");
                    setLoading(false);
                });
            };

            // Action: Delete room (Approved/Active)
            const handleDelete = (roomName) => {
                if (!confirm(`⚠️ 警告:「${roomName}」の承認を取り消し、クラウド上のデータを完全に削除しますか？\nこの操作は取り消せません。`)) return;
                setLoading(true);

                fetch(apiEndpoint, {
                    method: "POST",
                    headers: { "Content-Type": "text/plain" },
                    body: JSON.stringify({ action: "admin_delete_data", room: roomName, token: token })
                })
                .then(res => {
                    if (!res.ok) throw new Error("サーバー通信エラーが発生しました。");
                    return res.text();
                })
                .then(text => {
                    if (text.startsWith("ERROR:")) throw new Error(text.replace("ERROR:", "").trim());
                    showToast(`「${roomName}」のデータを完全に削除しました`, "error");
                    setApprovedList(prev => prev.filter(r => r !== roomName));
                    setSavedRooms(prev => prev.filter(r => r.name !== roomName));
                    setTimeout(refreshData, 1000);
                })
                .catch(err => {
                    showToast("エラーが発生しました: " + err.message, "error");
                    setLoading(false);
                });
            };

            const handleLogout = () => {
                setIsLoggedIn(false);
                setToken("");
                localStorage.removeItem("gas_admin_token");
                showToast("ログアウトしました");
            };

            // Calculate active data size stats
            const totalDataSizeKB = useMemo(() => {
                const totalBytes = savedRooms.reduce((acc, r) => acc + (r.size || 0), 0);
                return (totalBytes / 1024).toFixed(2);
            }, [savedRooms]);

            // Filter lists based on search
            const filteredPending = pendingList.filter(r => r.toLowerCase().includes(searchQuery.toLowerCase()));
            const filteredApproved = approvedList.filter(r => r.toLowerCase().includes(searchQuery.toLowerCase()));
            const filteredActive = savedRooms.filter(r => r.name.toLowerCase().includes(searchQuery.toLowerCase()));

            // Helper to build app URL
            const getRoomUrl = (roomName) => {
                return `index.html?room=${encodeURIComponent(roomName)}`;
            };

            // 1. LOGIN SCREEN
            if (!isLoggedIn) {
                return (
                    <div className="min-h-vh flex flex-col justify-center items-center px-4 py-16">
                        <div className="w-full max-w-md glass-card rounded-2xl shadow-2xl p-8 border border-white/10 transition-all duration-300 hover:shadow-cyan-950/20">
                            <div className="flex flex-col items-center mb-8">
                                <span className="text-4xl mb-3">🛠️</span>
                                <h1 className="text-2xl font-bold font-display tracking-tight text-white">管理者コントロールパネル</h1>
                                <p className="text-sm text-gray-400 mt-2 text-center">部屋の承認・作成制限を管理します</p>
                            </div>

                            {error && (
                                <div className="mb-6 p-4 bg-red-500/10 border border-red-500/20 text-red-400 text-sm rounded-xl flex items-start gap-2 animate-pulse">
                                    <span>⚠️</span>
                                    <span>{error}</span>
                                </div>
                            )}

                            <form onSubmit={handleLogin} className="flex flex-col gap-5">
                                <div className="flex flex-col gap-2">
                                    <label className="text-xs font-semibold text-gray-400 uppercase tracking-wider">GAS WEB APPのURL</label>
                                    <input 
                                        type="url"
                                        placeholder="https://script.google.com/macros/s/..."
                                        value={apiEndpoint}
                                        onChange={(e) => setApiEndpoint(e.target.value)}
                                        className="w-full h-11 bg-black/40 border border-white/10 rounded-xl px-4 text-sm text-gray-200 focus:outline-none focus:ring-2 focus:ring-cyan-500 transition-all font-mono"
                                    />
                                </div>

                                <div className="flex flex-col gap-2">
                                    <label className="text-xs font-semibold text-gray-400 uppercase tracking-wider">管理用パスコード (TOKEN)</label>
                                    <input 
                                        type="password"
                                        placeholder="GASのADMIN_TOKENに設定したパスワード"
                                        value={token}
                                        onChange={(e) => setToken(e.target.value)}
                                        className="w-full h-11 bg-black/40 border border-white/10 rounded-xl px-4 text-sm text-gray-200 focus:outline-none focus:ring-2 focus:ring-cyan-500 transition-all font-mono"
                                    />
                                </div>

                                <button 
                                    type="submit"
                                    disabled={loading}
                                    className="w-full h-12 bg-cyan-600 hover:bg-cyan-500 disabled:bg-cyan-800 disabled:text-gray-500 font-bold text-sm text-white rounded-xl shadow-lg shadow-cyan-950/40 transition-colors flex items-center justify-center gap-2 cursor-pointer"
                                >
                                    {loading ? (
                                        <div className="w-5 h-5 border-2 border-white/30 border-t-white rounded-full animate-spin"></div>
                                    ) : (
                                        <span>ログイン ➔</span>
                                    )}
                                </button>
                            </form>
                        </div>
                    </div>
                );
            }

            // 2. DASHBOARD SCREEN
            return (
                <div className="max-w-6xl mx-auto px-4 py-8 md:py-12">
                    {/* Header */}
                    <div className="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-8 pb-6 border-b border-white/15">
                        <div>
                            <div className="flex items-center gap-3">
                                <span className="text-3xl">🛠️</span>
                                <h1 className="text-2xl md:text-3xl font-bold font-display text-white tracking-tight">マップツール 管理コンソール</h1>
                            </div>
                            <p className="text-sm text-gray-400 mt-1">承認制部屋システム & クラウドデータ管理</p>
                        </div>
                        <div className="flex items-center gap-3">
                            <button 
                                onClick={refreshData}
                                disabled={loading}
                                className="h-10 px-4 bg-white/5 hover:bg-white/10 text-xs font-semibold rounded-lg border border-white/10 flex items-center gap-2 transition-colors disabled:opacity-50 cursor-pointer"
                            >
                                🔄 同期更新
                            </button>
                            <button 
                                onClick={handleLogout}
                                className="h-10 px-4 bg-red-950/20 hover:bg-red-950/40 text-red-400 text-xs font-semibold rounded-lg border border-red-900/30 transition-colors cursor-pointer"
                            >
                                🚪 ログアウト
                            </button>
                        </div>
                    </div>

                    {/* Stats Widget */}
                    <div className="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-8">
                        <div className="glass-card rounded-xl p-5 border border-amber-500/10 flex items-center justify-between">
                            <div>
                                <p className="text-xs font-medium text-amber-400 uppercase tracking-wider">新規作成の申請</p>
                                <h3 className="text-3xl font-bold font-display text-white mt-1">{pendingList.length} <span className="text-sm font-sans font-normal text-gray-400">部屋</span></h3>
                            </div>
                            <span className="text-3xl">⏳</span>
                        </div>
                        <div className="glass-card rounded-xl p-5 border border-emerald-500/10 flex items-center justify-between">
                            <div>
                                <p className="text-xs font-medium text-emerald-400 uppercase tracking-wider">承認済み（枠）</p>
                                <h3 className="text-3xl font-bold font-display text-white mt-1">{approvedList.length} <span className="text-sm font-sans font-normal text-gray-400">部屋</span></h3>
                            </div>
                            <span className="text-3xl">✅</span>
                        </div>
                        <div className="glass-card rounded-xl p-5 border border-cyan-500/10 flex items-center justify-between">
                            <div>
                                <p className="text-xs font-medium text-cyan-400 uppercase tracking-wider">容量使用量 (保存中)</p>
                                <h3 className="text-3xl font-bold font-display text-white mt-1">{totalDataSizeKB} <span className="text-sm font-sans font-normal text-gray-400">KB</span></h3>
                                <p className="text-[10px] text-gray-500 mt-1">※ {savedRooms.length}つの部屋にデータがあります</p>
                            </div>
                            <span className="text-3xl">🗄️</span>
                        </div>
                    </div>

                    {/* Filter & Search */}
                    <div className="flex flex-col sm:flex-row gap-4 items-center justify-between mb-6">
                        {/* Tabs */}
                        <div className="flex bg-black/40 p-1.5 rounded-xl border border-white/10 w-full sm:w-auto">
                            <button 
                                onClick={() => setActiveTab("pending")}
                                className={`flex-1 sm:flex-none h-9 px-4 text-xs font-bold rounded-lg transition-colors flex items-center justify-center gap-2 cursor-pointer ${
                                    activeTab === "pending" 
                                        ? "bg-amber-500/20 text-amber-300 border border-amber-500/20" 
                                        : "text-gray-400 hover:text-white"
                                }`}
                            >
                                <span>⏳ 申請中</span>
                                <span className="px-1.5 py-0.5 bg-black/30 rounded text-[10px]">{pendingList.length}</span>
                            </button>
                            <button 
                                onClick={() => setActiveTab("approved")}
                                className={`flex-1 sm:flex-none h-9 px-4 text-xs font-bold rounded-lg transition-colors flex items-center justify-center gap-2 cursor-pointer ${
                                    activeTab === "approved" 
                                        ? "bg-emerald-500/20 text-emerald-300 border border-emerald-500/20" 
                                        : "text-gray-400 hover:text-white"
                                }`}
                            >
                                <span>✅ 承認済み</span>
                                <span className="px-1.5 py-0.5 bg-black/30 rounded text-[10px]">{approvedList.length}</span>
                            </button>
                            <button 
                                onClick={() => setActiveTab("active")}
                                className={`flex-1 sm:flex-none h-9 px-4 text-xs font-bold rounded-lg transition-colors flex items-center justify-center gap-2 cursor-pointer ${
                                    activeTab === "active" 
                                        ? "bg-cyan-500/20 text-cyan-300 border border-cyan-500/20" 
                                        : "text-gray-400 hover:text-white"
                                }`}
                            >
                                <span>🗄️ 保存データあり</span>
                                <span className="px-1.5 py-0.5 bg-black/30 rounded text-[10px]">{savedRooms.length}</span>
                            </button>
                        </div>

                        {/* Search input */}
                        <div className="w-full sm:w-72 relative">
                            <input 
                                type="text"
                                placeholder="部屋名で検索..."
                                value={searchQuery}
                                onChange={(e) => setSearchQuery(e.target.value)}
                                className="w-full h-11 bg-black/30 border border-white/10 rounded-xl px-4 pl-10 text-sm focus:outline-none focus:ring-2 focus:ring-cyan-500 text-gray-200"
                            />
                            <span className="absolute left-3.5 top-3.5 text-gray-500 text-xs">🔍</span>
                        </div>
                    </div>

                    {/* Table List Container */}
                    <div className="glass-card rounded-2xl overflow-hidden border border-white/10">
                        {loading && (
                            <div className="p-12 flex flex-col items-center justify-center gap-3 bg-black/20">
                                <div className="w-8 h-8 border-3 border-cyan-500/20 border-t-cyan-500 rounded-full animate-spin"></div>
                                <p className="text-xs text-cyan-400 font-mono font-semibold">LOADING CLOUD DATABASE...</p>
                            </div>
                        )}

                        {!loading && activeTab === "pending" && (
                            <div>
                                {filteredPending.length === 0 ? (
                                    <div className="p-12 text-center text-gray-400 text-sm">
                                        <p className="text-2xl mb-2">🎉</p>
                                        <p>承認待ちの新規部屋申請はありません。</p>
                                    </div>
                                ) : (
                                    <div className="overflow-x-auto">
                                        <table className="w-full text-left border-collapse">
                                            <thead>
                                                <tr className="border-b border-white/10 bg-black/20 text-xs uppercase text-gray-400 font-semibold tracking-wider">
                                                    <th className="p-4 pl-6">部屋名</th>
                                                    <th className="p-4">ステータス</th>
                                                    <th className="p-4 text-right pr-6">操作</th>
                                                </tr>
                                            </thead>
                                            <tbody className="divide-y divide-white/5 text-sm">
                                                {filteredPending.map(room => (
                                                    <tr key={room} className="hover:bg-white/5 transition-colors">
                                                        <td className="p-4 pl-6 font-mono font-medium text-white">{room}</td>
                                                        <td className="p-4">
                                                            <span className="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-semibold bg-amber-400/15 text-amber-400 border border-amber-400/10">
                                                                ● 承認待ち
                                                            </span>
                                                        </td>
                                                        <td className="p-4 text-right pr-6 flex justify-end gap-2.5">
                                                            <button 
                                                                onClick={() => handleApprove(room)}
                                                                className="h-9 px-4 bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-xs rounded-lg transition-colors cursor-pointer"
                                                            >
                                                                👍 承認する
                                                            </button>
                                                            <button 
                                                                onClick={() => handleReject(room)}
                                                                className="h-9 px-4 bg-white/5 hover:bg-red-500/20 hover:text-red-400 border border-white/10 hover:border-red-500/15 text-gray-300 font-bold text-xs rounded-lg transition-all cursor-pointer"
                                                            >
                                                                ✖ 却下する
                                                            </button>
                                                        </td>
                                                    </tr>
                                                ))}
                                            </tbody>
                                        </table>
                                    </div>
                                )}
                            </div>
                        )}

                        {!loading && activeTab === "approved" && (
                            <div>
                                {filteredApproved.length === 0 ? (
                                    <div className="p-12 text-center text-gray-400 text-sm">
                                        <p className="text-2xl mb-2">📋</p>
                                        <p>承認済みの部屋（枠）はありません。</p>
                                    </div>
                                ) : (
                                    <div className="overflow-x-auto">
                                        <table className="w-full text-left border-collapse">
                                            <thead>
                                                <tr className="border-b border-white/10 bg-black/20 text-xs uppercase text-gray-400 font-semibold tracking-wider">
                                                    <th className="p-4 pl-6">部屋名</th>
                                                    <th className="p-4">ステータス</th>
                                                    <th className="p-4">マップリンク</th>
                                                    <th className="p-4 text-right pr-6">操作</th>
                                                </tr>
                                            </thead>
                                            <tbody className="divide-y divide-white/5 text-sm">
                                                {filteredApproved.map(room => (
                                                    <tr key={room} className="hover:bg-white/5 transition-colors">
                                                        <td className="p-4 pl-6 font-mono font-medium text-white">{room}</td>
                                                        <td className="p-4">
                                                            <span className="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-semibold bg-emerald-400/15 text-emerald-400 border border-emerald-400/10">
                                                                ● 承認済み (新規枠)
                                                            </span>
                                                        </td>
                                                        <td className="p-4">
                                                            <a 
                                                                href={getRoomUrl(room)} 
                                                                target="_blank" 
                                                                className="text-cyan-400 hover:underline inline-flex items-center gap-1.5 font-semibold text-xs"
                                                            >
                                                                お部屋を開く 🔗
                                                            </a>
                                                        </td>
                                                        <td className="p-4 text-right pr-6">
                                                            <button 
                                                                onClick={() => handleDelete(room)}
                                                                className="h-9 px-4 bg-red-950/20 hover:bg-red-500/20 text-red-400 hover:border-red-500/20 font-bold text-xs rounded-lg border border-red-900/30 transition-all cursor-pointer"
                                                            >
                                                                ✖ 承認取り消し・削除
                                                            </button>
                                                        </td>
                                                    </tr>
                                                ))}
                                            </tbody>
                                        </table>
                                    </div>
                                )}
                            </div>
                        )}

                        {!loading && activeTab === "active" && (
                            <div>
                                {filteredActive.length === 0 ? (
                                    <div className="p-12 text-center text-gray-400 text-sm">
                                        <p className="text-2xl mb-2">🗄️</p>
                                        <p>実際にクラウドデータが保存されている部屋はありません。</p>
                                    </div>
                                ) : (
                                    <div className="overflow-x-auto">
                                        <table className="w-full text-left border-collapse">
                                            <thead>
                                                <tr className="border-b border-white/10 bg-black/20 text-xs uppercase text-gray-400 font-semibold tracking-wider">
                                                    <th className="p-4 pl-6">部屋名</th>
                                                    <th className="p-4">データサイズ</th>
                                                    <th className="p-4">マップリンク</th>
                                                    <th className="p-4 text-right pr-6">操作</th>
                                                </tr>
                                            </thead>
                                            <tbody className="divide-y divide-white/5 text-sm">
                                                {filteredActive.map(room => (
                                                    <tr key={room.name} className="hover:bg-white/5 transition-colors">
                                                        <td className="p-4 pl-6 font-mono font-medium text-white">{room.name}</td>
                                                        <td className="p-4 font-mono text-xs text-gray-400">{(room.size / 1024).toFixed(2)} KB</td>
                                                        <td className="p-4">
                                                            <a 
                                                                href={getRoomUrl(room.name)} 
                                                                target="_blank" 
                                                                className="text-cyan-400 hover:underline inline-flex items-center gap-1.5 font-semibold text-xs"
                                                            >
                                                                お部屋を開く 🔗
                                                            </a>
                                                        </td>
                                                        <td className="p-4 text-right pr-6">
                                                            <button 
                                                                onClick={() => handleDelete(room.name)}
                                                                className="h-9 px-4 bg-red-950/20 hover:bg-red-500/20 text-red-400 hover:border-red-500/20 font-bold text-xs rounded-lg border border-red-900/30 transition-all cursor-pointer"
                                                            >
                                                                ⚠️ データを完全消去
                                                            </button>
                                                        </td>
                                                    </tr>
                                                ))}
                                            </tbody>
                                        </table>
                                    </div>
                                )}
                            </div>
                        )}
                    </div>

                    {/* Security Tip */}
                    <div className="mt-8 p-4 bg-blue-500/5 border border-blue-500/10 rounded-xl text-xs text-gray-400 leading-relaxed">
                        <h4 className="font-bold text-blue-400 mb-1">💡 セキュリティについて</h4>
                        <p>
                            この管理用コントロールパネルは、GASプロジェクト内に書き込んだ <strong>ADMIN_TOKEN</strong> で守られています。
                            他人にこのパスコードを教えないようにしてください。必要に応じて、GASプロジェクト側のパスワードを変更するだけでいつでもパスコードを変更できます。
                        </p>
                    </div>

                    {/* Toast Notification */}
                    {toast && (
                        <div className={`fixed bottom-6 right-6 px-5 py-3.5 rounded-xl text-sm font-semibold shadow-2xl flex items-center gap-2 border animate-bounce z-[9999] ${
                            toast.type === "success" ? "bg-emerald-500/10 border-emerald-500/20 text-emerald-400" :
                            toast.type === "error" ? "bg-red-500/10 border-red-500/20 text-red-400" :
                            toast.type === "warning" ? "bg-amber-500/10 border-amber-500/20 text-amber-400" :
                            "bg-slate-800 border-white/10 text-white"
                        }`}>
                            <span>{toast.type === "success" ? "✅" : toast.type === "error" ? "❌" : "⚠️"}</span>
                            <span>{toast.message}</span>
                        </div>
                    )}
                </div>
            );
        }

        const container = document.getElementById('root');
        const root = ReactDOM.createRoot(container);
        root.render(<AdminApp />);
    </script>
</body>
</html>
